name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    name: build + test
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v6

      # Self-hosted runners: put the SDK under the runner account's home, which it can always write,
      # never in the system install (which it cannot).
      - name: Choose where setup-dotnet installs
        if: runner.environment == 'self-hosted'
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"
      # Install the SDK in the job instead of trusting the runner's: every build then bundles the
      # current runtime whichever runner picked it up. It also sets DOTNET_ROOT, which the xUnit v3
      # / MTP test apphosts need to find the runtime.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: Directory.Packages.props

      # Building the test project builds ardopcall itself through its project
      # reference, so this is the whole tree.
      - name: build
        run: dotnet build tests/Ardopcall.Tests/Ardopcall.Tests.csproj --nologo -warnaserror

      # Hermetic: the only network the suite touches is loopback, against an
      # in-process fake TNC. No radio, no Docker, no TNC on the LAN.
      - name: test
        run: dotnet test tests/Ardopcall.Tests/Ardopcall.Tests.csproj --nologo --no-build
