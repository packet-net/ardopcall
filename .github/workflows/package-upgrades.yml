name: package upgrades

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: package-upgrades
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upgrade:
    name: upgrade packages
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Choose where setup-dotnet installs
        if: runner.environment == 'self-hosted'
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: full upgrade, build and test
        id: full
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bump-packages.py ardopcall.slnx | tee "$RUNNER_TEMP/upgrades.txt"
          dotnet build tests/Ardopcall.Tests/Ardopcall.Tests.csproj --nologo -warnaserror
          dotnet test tests/Ardopcall.Tests/Ardopcall.Tests.csproj --nologo --no-build

      - name: security fallback, build and test
        id: security
        if: steps.full.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fdx -e .dotnet
          python3 scripts/bump-packages.py ardopcall.slnx --vulnerable-only | tee "$RUNNER_TEMP/upgrades.txt"
          dotnet build tests/Ardopcall.Tests/Ardopcall.Tests.csproj --nologo -warnaserror
          dotnet test tests/Ardopcall.Tests/Ardopcall.Tests.csproj --nologo --no-build

      - name: commit and push
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          if git diff --cached --quiet; then
            echo "nothing to upgrade"
            exit 0
          fi
          if [ "${{ steps.full.outcome }}" = "failure" ]; then
            subject="chore(deps): security package fixes"
          else
            subject="chore(deps): package upgrades"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "$subject"
            echo
            echo "Built and tested before commit. Changed by scripts/bump-packages.py:"
            echo
            cat "$RUNNER_TEMP/upgrades.txt"
          } > "$RUNNER_TEMP/commit-msg.txt"
          git commit -q -F "$RUNNER_TEMP/commit-msg.txt"
          git pull -q --rebase origin main
          git push origin HEAD:main
